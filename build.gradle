plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

group = "com.metalrender"
version = project.mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
repositories {

    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
        maven {
            name = "LWJGL"
            url = "https://repo.lwjgl.org/"
        }
}
dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.158.0+26.2"
    implementation "org.lwjgl:lwjgl:3.3.3"
    implementation "org.lwjgl:lwjgl-glfw:3.3.3"
    implementation "org.lwjgl:lwjgl:3.3.3:natives-macos"
    implementation "org.lwjgl:lwjgl-glfw:3.3.3:natives-macos"
    implementation 'org.joml:joml:1.10.5'
    def irisVulkanJar = providers.gradleProperty("irisVulkanJar").orNull
    if (irisVulkanJar != null) {
        implementation "net.caffeinemc:sodium-fabric:0.9.1-beta.3+mc26.2"
        implementation files(irisVulkanJar)
    } else {
        implementation "maven.modrinth:sodium:mc26.2-0.9.1-fabric"
        implementation "maven.modrinth:iris:1.11.2+26.2-fabric"
    }
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            client()
            source sourceSets.client
            if (project.hasProperty('rendererTestRunDir')) {
                runDir project.property('rendererTestRunDir').toString()
            }
            if (project.hasProperty('rendererTestWorld')) {
                programArg '--quickPlaySingleplayer'
                programArg project.property('rendererTestWorld').toString()
            }
            vmArg "-Djava.library.path=${projectDir}/src/main/resources"
            vmArg "--enable-preview"
            vmArg "--enable-native-access=ALL-UNNAMED"

            if (project.hasProperty('irisVulkanJar')) {
                vmArg "-Diris.vulkan.screenPassMode=all"
                vmArg "-Diris.vulkan.screenPassDrawMode=shaderpack"
            }
            
            if (project.hasProperty('gl2metal')) {
                vmArg "-Dmetalrender.gl2metal=true"
            }
            
            ['state', 'drawcalls', 'buffers', 'textures', 'shaders', 'fbos', 'vaos', 'debug'].each { category ->
                if (project.hasProperty("gl2metal.${category}")) {
                    vmArg "-Dmetalrender.gl2metal.${category}=true"
                }
            }
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs += ['--enable-preview']
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
    jar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from('src/main/resources/native') {
            include 'metalrender.h', 'metalrender.mm'
            into 'native'
        }
    }
